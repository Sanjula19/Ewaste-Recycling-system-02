# E-Waste Recycling System — Docker Compose
# ---------------------------------------------------------------------------
# Five independent containers on one internal network. Each service keeps
# its own dependencies, runtime, and storage — nothing is merged.
#
#   docker compose up --build     start everything
#   docker compose down           stop and remove containers (add -v to also
#                                  drop the named volumes / SQLite data)
#
# Component 2 (Sanjula — Toxic Gas Detection) is completely independent: it
# is not referenced by, and does not call, component1/3/4. The gateway only
# proxies to it, same as the others.
#
# Component 3 (Step 5B) now runs the REAL Smart Process Optimization
# backend — see component-3/REAL-COMPONENT-3.md. It uses Firestore, not
# SQLite, so it has no database volume of its own (unlike Component 2).

networks:
  ewaste-net:
    driver: bridge

volumes:
  component2-db-data:

services:
  # -------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: "8080"
      # Container-to-container: service names, NOT localhost.
      COMPONENT1_URL: ${COMPONENT1_URL:-http://component1:8001}
      COMPONENT2_URL: ${COMPONENT2_URL:-http://component2:8002}
      COMPONENT3_URL: ${COMPONENT3_URL:-http://component3:8003}
      COMPONENT4_URL: ${COMPONENT4_URL:-http://component4:8004}
      PROXY_TIMEOUT: ${PROXY_TIMEOUT:-30}
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      - component1
      - component2
      - component3
      - component4
    networks:
      - ewaste-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Component 1 — AI Waste Assessment (Shehan)
  # Both resnet50_waste_type_final.keras and resnet50_condition_final.keras
  # are present in component-1/component_1/backend/models/ — see that
  # Dockerfile's header comment.
  component1:
    build:
      context: ./component-1/component_1/backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    networks:
      - ewaste-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Component 2 — Toxic Gas Detection (Sanjula) — INDEPENDENT SERVICE
  component2:
    build:
      context: ./component-2/backend
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      # Optional: component-2/backend/.env holds real MQTT/JWT secrets and
      # is intentionally untracked (see .env.example next to it). Compose
      # must still parse/build/run when it's absent — `required: false`
      # (Compose v2.24+) skips it instead of failing. If missing, the
      # container falls back to the defaults already baked into
      # app/config.py, same as running `uvicorn` directly without a .env.
      - path: ./component-2/backend/.env
        required: false
    environment:
      # Override the .env's relative sqlite path so data survives container
      # recreation via the named volume mounted below.
      DATABASE_URL: sqlite+aiosqlite:////data/component2_ewaste_gas.db
    volumes:
      - component2-db-data:/data
    networks:
      - ewaste-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Component 3 — Smart Process Optimization (Wisu) — REAL backend
  # Uses Firestore for persistence, not a local database — no SQLite volume
  # or DATABASE_URL here (that was stale config from the old, wrong backend).
  #
  # Firestore credential: app/config.py reads app/firebase_key.json from a
  # fixed relative path — it takes no environment variables. That file is a
  # real Firebase service-account key, is gitignored, and is excluded from
  # the image by .dockerignore. The bind mount below supplies it at runtime
  # ONLY if it already exists on your machine at that path — never commit
  # it, and never bake it into the image.
  #
  # If the file does not exist locally, Docker will create an empty
  # directory at the mount target instead of failing the mount. The
  # backend's own Firebase-init code already handles that failure
  # gracefully (logs an error, disables persistence) — /api/optimize still
  # returns a full result, /api/history just returns nothing. See
  # component-3/REAL-COMPONENT-3.md for details.
  component3:
    build:
      context: ./component-3/backend
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - ./component-3/backend/app/firebase_key.json:/app/app/firebase_key.json:ro
    networks:
      - ewaste-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Component 4 — Predictive Economic Valuation (Mayashi)
  # InfluxDB is optional — omitted here on purpose; the backend falls back
  # to the bundled historical CSVs when INFLUXDB_URL is unset/unreachable.
  component4:
    build:
      context: ./component-4/backend
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    networks:
      - ewaste-net
    restart: unless-stopped
